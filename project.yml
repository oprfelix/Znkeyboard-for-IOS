name: ZnKeyboard
options:
  bundleIdPrefix: com.oprfelix
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  ZnKeyboardCore:
    path: .
settings:
  base:
    DEVELOPMENT_TEAM: 6DSHU7W7LQ
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "9"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ZnKeyboard:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - App.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oprfelix.znkeyboard
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
    dependencies:
      - target: ZnKeyboardExtension
        embed: true
      - package: ZnKeyboardCore
        product: PinyinCore
  ZnKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - path: Sources/PinyinCore/Resources/dict.bin
        buildPhase: resources
      - path: Sources/PinyinCore/Resources/lm.bin
        buildPhase: resources
      - path: Sources/PinyinCore/Resources/english.txt
        buildPhase: resources
      - path: Sources/PinyinCore/Resources/en_char_trigram.bin
        buildPhase: resources
      - path: Sources/PinyinCore/Resources/pinyin_char_trigram.bin
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: ZnKeyboardExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.oprfelix.znkeyboard.keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Keyboard/Keyboard.entitlements
    dependencies:
      - package: ZnKeyboardCore
        product: PinyinCore
